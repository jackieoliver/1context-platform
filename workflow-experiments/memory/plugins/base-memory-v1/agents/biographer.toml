id = "biographer"
version = "0.1.0"
harness = "claude-code"
provider = "claude"
model = "opus"
tools = []
prompt_paths = ["prompts/agent-profile.md"]
reference_paths = ["prompts/biographer.md", "prompts/operator-touched-convention.md"]
experience = []

[memory]
mode = "runtime_lived_experience"
attach = "new"

[runtime]
isolation = "account_clean"
subscription_compatible = true
notes = "Direct-edits the Biography section from routed article context; no raw session rediscovery by default."
